<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Senior Technical Manager — Prep Planner</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f5f4f0;--bg3:#efede8;--tx:#1a1a18;--tx2:#5f5e5a;--tx3:#888780;
  --bd:rgba(0,0,0,0.12);
  --b400:#378ADD;--b50:#e6f1fb;--b800:#0C447C;
  --t400:#1D9E75;--t50:#e1f5ee;--t800:#085041;
  --a400:#BA7517;--a50:#faeeda;--a800:#633806;
  --p400:#7F77DD;--p50:#eeedfe;--p800:#3C3489;
  --g50:#f1efe8;--g6:#5f5e5a;
  --rm:8px;--rl:12px
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1e1e1c;--bg2:#2a2a28;--bg3:#333331;--tx:#e8e6e0;--tx2:#a8a6a0;--tx3:#6e6d69;
  --bd:rgba(255,255,255,0.1);
  --b50:#0c2a45;--b800:#B5D4F4;
  --t50:#052a1e;--t800:#9FE1CB;
  --a50:#2a1a05;--a800:#faeeda;
  --p50:#1a1840;--p800:#CECBF6;
  --g50:#2a2a28;--g6:#B4B2A9
}}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:var(--bg3);color:var(--tx);padding:24px 16px;min-height:100vh}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:20px;font-weight:600;margin-bottom:4px}
.sub{font-size:13px;color:var(--tx2)}
.meta{font-size:11px;color:var(--tx3);margin-top:4px;margin-bottom:24px}

/* Progress bar */
.progress-bar{background:var(--bg);border:0.5px solid var(--bd);border-radius:var(--rl);padding:16px 20px;margin-bottom:16px}
.progress-bar h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--tx3);margin-bottom:10px}
.progress-track{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;margin-bottom:8px}
.progress-fill{height:100%;background:var(--t400);border-radius:4px;transition:width 0.4s ease}
.progress-stats{display:flex;gap:16px;flex-wrap:wrap}
.stat{font-size:12px;color:var(--tx2)}
.stat strong{font-weight:600;color:var(--tx)}

/* Section blocks */
.section{background:var(--bg);border:0.5px solid var(--bd);border-radius:var(--rl);margin-bottom:16px;overflow:hidden}
.section-head{padding:14px 20px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;border-bottom:0.5px solid var(--bd)}
.section-head:hover{background:var(--bg2)}
.section-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.badge-blue{background:var(--b50);color:var(--b800)}
.badge-teal{background:var(--t50);color:var(--t800)}
.badge-amber{background:var(--a50);color:var(--a800)}
.badge-purple{background:var(--p50);color:var(--p800)}
.section-title{font-size:14px;font-weight:600;flex:1}
.section-count{font-size:12px;color:var(--tx3);margin-left:auto}
.chevron{font-size:12px;color:var(--tx3);transition:transform 0.2s}
.section.collapsed .chevron{transform:rotate(-90deg)}
.section.collapsed .section-body{display:none}
.section-body{padding:0}

/* Items */
.item{display:flex;align-items:flex-start;gap:12px;padding:12px 20px;border-bottom:0.5px solid var(--bd);transition:background 0.15s}
.item:last-child{border-bottom:none}
.item:hover{background:var(--bg2)}
.item-check{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--bd);background:var(--bg);cursor:pointer;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:background 0.15s,border-color 0.15s}
.item-check.done{background:var(--t400);border-color:var(--t400)}
.item-check.done::after{content:"✓";font-size:11px;color:#fff;font-weight:700}
.item-check.in-progress{background:var(--a50);border-color:var(--a400)}
.item-check.in-progress::after{content:"◐";font-size:10px;color:var(--a400)}
.item-body{flex:1;min-width:0}
.item-label{font-size:13px;font-weight:500;line-height:1.4}
.item-label.done{text-decoration:line-through;color:var(--tx3)}
.item-desc{font-size:12px;color:var(--tx2);margin-top:2px;line-height:1.5}
.item-tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:500;padding:1px 6px;border-radius:10px;background:var(--g50);color:var(--g6)}
.item-actions{display:flex;align-items:center;gap:6px}
.pill{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap}
.pill-done{background:var(--t50);color:var(--t800)}
.pill-progress{background:var(--a50);color:var(--a800)}
.pill-todo{background:var(--g50);color:var(--g6)}

/* Notes */
.notes-area{padding:16px 20px}
.notes-area label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--tx3);display:block;margin-bottom:6px}
.notes-area textarea{width:100%;background:var(--bg2);border:0.5px solid var(--bd);border-radius:var(--rm);padding:10px 12px;font-size:13px;color:var(--tx);font-family:inherit;resize:vertical;min-height:72px;outline:none;transition:border-color 0.15s}
.notes-area textarea:focus{border-color:var(--b400)}
.notes-area textarea::placeholder{color:var(--tx3)}

/* Controls row */
.ctrl{background:var(--bg);border:0.5px solid var(--bd);border-radius:var(--rl);padding:14px 20px;margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ctrl-label{font-size:12px;color:var(--tx2)}
.btn{font-size:12px;font-weight:500;padding:6px 14px;border-radius:var(--rm);border:0.5px solid var(--bd);background:var(--bg2);color:var(--tx);cursor:pointer;transition:background 0.15s}
.btn:hover{background:var(--bg3)}
.btn-primary{background:var(--b400);border-color:var(--b400);color:#fff}
.btn-primary:hover{background:var(--b800);border-color:var(--b800)}
.spacer{flex:1}

/* Interview date */
.date-chip{display:inline-flex;align-items:center;gap:6px;background:var(--a50);color:var(--a800);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:500}
</style>
</head>
<body>
<div class="wrap">

  <h1>Senior Technical Manager — Prep Planner</h1>
  <p class="sub">Interview preparation tracker for leadership &amp; technical depth</p>
  <p class="meta">
    <span class="date-chip">Interview: <strong id="interviewDate">Not set</strong></span>
    &nbsp;&nbsp;Last updated: <span id="lastUpdated">—</span>
  </p>

  <!-- Controls -->
  <div class="ctrl">
    <span class="ctrl-label">Filter:</span>
    <button class="btn" onclick="filterItems('all')" id="f-all">All</button>
    <button class="btn" onclick="filterItems('todo')" id="f-todo">To Do</button>
    <button class="btn" onclick="filterItems('in-progress')" id="f-progress">In Progress</button>
    <button class="btn" onclick="filterItems('done')" id="f-done">Done</button>
    <div class="spacer"></div>
    <button class="btn btn-primary" onclick="setInterviewDate()">Set Interview Date</button>
    <button class="btn" onclick="resetAll()">Reset</button>
  </div>

  <!-- Progress -->
  <div class="progress-bar">
    <h2>Overall Progress</h2>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-stats">
      <span class="stat"><strong id="statDone">0</strong> done</span>
      <span class="stat"><strong id="statProgress">0</strong> in progress</span>
      <span class="stat"><strong id="statTodo">0</strong> to do</span>
      <span class="stat"><strong id="statTotal">0</strong> total</span>
    </div>
  </div>

  <!-- Sections injected by JS -->
  <div id="sections"></div>

</div>

<script>
const DATA = [
  {
    id:"leadership",
    title:"Leadership & People Management",
    badge:"badge-blue",
    badgeText:"Leadership",
    items:[
      {id:"l1",label:"Managing conflicting priorities across teams",desc:"Prepare a STAR story: competing deadlines, resource constraints, how you navigated trade-offs.",tags:["STAR","People"]},
      {id:"l2",label:"Growing engineers from mid to senior",desc:"Concrete example of someone you mentored, what you did differently, measurable outcome.",tags:["Mentoring","Growth"]},
      {id:"l3",label:"Handling underperformance",desc:"Structured approach: early signals, direct conversation, PIP vs. coaching, outcome.",tags:["Performance"]},
      {id:"l4",label:"Building psychological safety",desc:"Practices you've embedded: blameless retros, 1:1 structure, team norms.",tags:["Culture"]},
      {id:"l5",label:"Hiring & bar raising",desc:"How you define the hiring bar, your interview loop design, how you calibrate with peers.",tags:["Hiring"]},
      {id:"l6",label:"Org design & team topology",desc:"When to split teams, stream-aligned vs. enabling teams, how you've restructured.",tags:["Org Design"]},
    ]
  },
  {
    id:"technical",
    title:"Technical Depth & Architecture",
    badge:"badge-teal",
    badgeText:"Technical",
    items:[
      {id:"t1",label:"System design: distributed data pipeline",desc:"Design a high-throughput ingestion system. Discuss partitioning, fault tolerance, back-pressure.",tags:["System Design","Distributed"]},
      {id:"t2",label:"Cloud architecture trade-offs",desc:"Serverless vs. containers vs. VMs, multi-cloud strategy, cost vs. latency vs. ops overhead.",tags:["Cloud","Architecture"]},
      {id:"t3",label:"API design principles",desc:"REST vs. gRPC vs. GraphQL, versioning, idempotency, rate limiting, backward compat.",tags:["API"]},
      {id:"t4",label:"Observability stack",desc:"Metrics, logs, traces — your preferred tooling, how you've driven adoption, SLO definition.",tags:["Observability","SRE"]},
      {id:"t5",label:"Security & compliance at scale",desc:"Threat modelling, shift-left security practices, data residency, GDPR considerations.",tags:["Security"]},
      {id:"t6",label:"Technical debt management",desc:"How you balance delivery vs. quality: debt tracking, prioritisation frameworks, stakeholder comms.",tags:["Delivery"]},
    ]
  },
  {
    id:"delivery",
    title:"Delivery & Execution",
    badge:"badge-amber",
    badgeText:"Delivery",
    items:[
      {id:"d1",label:"Defining and tracking engineering metrics",desc:"DORA metrics, cycle time, deployment frequency — how you've introduced and acted on them.",tags:["Metrics","DORA"]},
      {id:"d2",label:"Cross-functional alignment",desc:"Working with Product and Design: who drives the roadmap, how you resolve scope debates.",tags:["Cross-functional"]},
      {id:"d3",label:"Incident management & post-mortems",desc:"On-call culture, severity definitions, runbooks, blameless post-mortem process.",tags:["Incidents","SRE"]},
      {id:"d4",label:"Estimation & forecasting",desc:"How you give confidence intervals, manage stakeholder expectations, handle scope creep.",tags:["Planning"]},
      {id:"d5",label:"Remote / async-first ways of working",desc:"Documentation culture, decision logs, async standups, how you maintain team cohesion.",tags:["Remote","Culture"]},
    ]
  },
  {
    id:"strategy",
    title:"Strategy & Stakeholder Influence",
    badge:"badge-purple",
    badgeText:"Strategy",
    items:[
      {id:"s1",label:"Build vs. buy vs. partner decisions",desc:"Framework you use, examples of decisions made, how you brought stakeholders along.",tags:["Strategy"]},
      {id:"s2",label:"Influencing without authority",desc:"Getting alignment from peer teams or external partners where you had no direct authority.",tags:["Influence"]},
      {id:"s3",label:"Presenting technical strategy to exec level",desc:"How you translate technical concepts, structure the narrative, handle push-back.",tags:["Communication","Exec"]},
      {id:"s4",label:"OKRs and goal-setting",desc:"How you cascade OKRs into team-level goals, measure progress, and adjust mid-cycle.",tags:["OKRs","Planning"]},
      {id:"s5",label:"Operating in ambiguity",desc:"A time you had to make a significant decision with incomplete information — how did you proceed?",tags:["STAR","Leadership"]},
    ]
  }
];

const STATE_KEY = "prep_planner_state";
const DATE_KEY  = "prep_planner_date";

function loadState(){
  try{ return JSON.parse(localStorage.getItem(STATE_KEY)||"{}"); }catch(e){ return {}; }
}
function saveState(s){ localStorage.setItem(STATE_KEY, JSON.stringify(s)); }
function loadDate(){ return localStorage.getItem(DATE_KEY)||""; }
function saveDate(d){ localStorage.setItem(DATE_KEY, d); }

let state = loadState();
let currentFilter = "all";

function cycleStatus(id){
  const map = {"":"in-progress","in-progress":"done","done":""};
  state[id] = map[state[id]||""] || "";
  saveState(state);
  renderAll();
  updateLastUpdated();
}

function updateLastUpdated(){
  document.getElementById("lastUpdated").textContent = new Date().toLocaleString();
}

function setInterviewDate(){
  const d = prompt("Enter interview date (e.g. 2 Apr 2026):", loadDate());
  if(d !== null){ saveDate(d.trim()); renderHeader(); }
}

function renderHeader(){
  const d = loadDate();
  document.getElementById("interviewDate").textContent = d || "Not set";
}

function resetAll(){
  if(!confirm("Reset all progress?")) return;
  state = {};
  saveState(state);
  renderAll();
}

function filterItems(f){
  currentFilter = f;
  ["all","todo","progress","done"].forEach(k=>{
    const el = document.getElementById("f-"+k);
    if(el) el.style.fontWeight = (k===f||(k==="progress"&&f==="in-progress")) ? "700" : "";
  });
  renderAll();
}

function matchesFilter(s){
  if(currentFilter==="all") return true;
  if(currentFilter==="done") return s==="done";
  if(currentFilter==="in-progress") return s==="in-progress";
  if(currentFilter==="todo") return !s || s==="";
  return true;
}

function renderAll(){
  const container = document.getElementById("sections");
  let totalDone=0, totalProgress=0, totalTodo=0, totalAll=0;

  ALL_ITEMS.forEach(({id,s})=>{
    totalAll++;
    if(s==="done") totalDone++;
    else if(s==="in-progress") totalProgress++;
    else totalTodo++;
  });

  // Update progress
  const pct = totalAll ? Math.round(totalDone/totalAll*100) : 0;
  document.getElementById("progressFill").style.width = pct+"%";
  document.getElementById("statDone").textContent = totalDone;
  document.getElementById("statProgress").textContent = totalProgress;
  document.getElementById("statTodo").textContent = totalTodo;
  document.getElementById("statTotal").textContent = totalAll;

  // Render sections
  container.innerHTML = DATA.map(sec=>{
    const items = sec.items.filter(it=> matchesFilter(state[it.id]||""));
    if(!items.length && currentFilter!=="all") return "";
    const doneCount = sec.items.filter(it=>(state[it.id]||"")==="done").length;
    const isCollapsed = sec.collapsed ? "collapsed" : "";
    return `
    <div class="section ${isCollapsed}" id="sec-${sec.id}">
      <div class="section-head" onclick="toggleSection('${sec.id}')">
        <span class="section-badge ${sec.badge}">${sec.badgeText}</span>
        <span class="section-title">${sec.title}</span>
        <span class="section-count">${doneCount}/${sec.items.length}</span>
        <span class="chevron">▾</span>
      </div>
      <div class="section-body">
        ${items.map(it=>{
          const s = state[it.id]||"";
          const pillClass = s==="done"?"pill-done":s==="in-progress"?"pill-progress":"pill-todo";
          const pillText  = s==="done"?"Done":s==="in-progress"?"In Progress":"To Do";
          const labelClass = s==="done"?"done":"";
          return `
          <div class="item" data-status="${s}">
            <div class="item-check ${s}" onclick="cycleStatus('${it.id}')"></div>
            <div class="item-body">
              <div class="item-label ${labelClass}">${it.label}</div>
              <div class="item-desc">${it.desc}</div>
              <div class="item-tags">${it.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
            </div>
            <div class="item-actions">
              <span class="pill ${pillClass}" onclick="cycleStatus('${it.id}')" style="cursor:pointer">${pillText}</span>
            </div>
          </div>`;
        }).join("")}
        <div class="notes-area">
          <label>Section notes</label>
          <textarea placeholder="Add preparation notes for this section…" rows="2"
            onchange="saveNote('${sec.id}', this.value)"
          >${loadNote(sec.id)}</textarea>
        </div>
      </div>
    </div>`;
  }).join("");
}

// Flatten items for stats
let ALL_ITEMS = [];
DATA.forEach(sec=> sec.items.forEach(it=> ALL_ITEMS.push({id:it.id, get s(){ return state[it.id]||""; }})));

function toggleSection(id){
  const el = document.getElementById("sec-"+id);
  el.classList.toggle("collapsed");
}

function saveNote(secId, val){
  localStorage.setItem("note_"+secId, val);
}
function loadNote(secId){
  return (localStorage.getItem("note_"+secId)||"").replace(/</g,"&lt;");
}

// Init
renderHeader();
renderAll();
updateLastUpdated();

// Highlight active filter
document.getElementById("f-all").style.fontWeight = "700";
</script>
</body>
</html>
